<!DOCTYPE html>
<html>
<head>
  <style>
    body, html {
      margin: 0;
      padding: 0;
      height: 100%;
      overflow: hidden;
    }

    /* Background video */
    .video-bg {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: -1;
      pointer-events: none;
    }

    .video-bg iframe {
      width: 100%;
      height: 100%;
    }

    /* Your content */
    .content {
      position: relative;
      z-index: 1;
      color: white;
      font-size: 2rem;
      text-align: center;
      margin-top: 20%;
      text-shadow: 0 0 10px black;
    }
  </style>
</head>
<body>

<div class="video-bg">
  <iframe 
    src="https://www.youtube.com/embed/9mg9PoFEX2U?autoplay=1&mute=1&controls=0&loop=1&playlist=VIDEO_ID"
    frameborder="0"
    allow="autoplay; fullscreen">
  </iframe>
</div>

<div class="content">
  <!-- Your class timer goes here -->
  Time left in class: <span id="timer">00:00</span>
</div>

</body>
</html>
