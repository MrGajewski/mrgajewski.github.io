<!DOCTYPE html>
<html>
<head>
  <title>Glenbard Clock</title>

  <!-- Fonts -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Roboto:300,400,600">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Source+Code+Pro">

  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      font-family: 'Roboto', sans-serif;
      color: white;
      overflow: hidden;
      background: black;
    }

    /* VIDEO */
    .video-bg iframe {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 177.78vh;
      height: 100vh;
      transform: translate(-50%, -50%);
    }

    /* HIDE VIDEO FOR SCHOOL THEMES */
    body.theme-geast .video-bg,
    body.theme-gnorth .video-bg,
    body.theme-gsouth .video-bg,
    body.theme-gwest .video-bg {
      display: none;
    }

    /* OVERLAY */
    .overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.3);
      pointer-events: none;
    }

    /* CLOCK PANEL (original style) */
    .container {
      position: relative;
      text-align: center;
      margin: 8vh auto;
      padding: 25px 40px;
      width: fit-content;

      background: rgba(0,0,0,0.35);
      backdrop-filter: blur(10px);
      border-radius: 16px;

      border: 2px solid var(--primary, white);
      box-shadow: 0 8px 30px rgba(0,0,0,0.5);

      transition: all 0.4s ease;
      z-index: 2;
    }

    /* GLOW for school themes */
    body[class*="theme-g"] .container {
      box-shadow: 0 0 20px var(--primary);
    }

    h1 {
      font-size: 4rem;
      font-weight: 300;
      margin: 0;
    }

    h2 {
      font-weight: 300;
      margin: 5px;
      opacity: 0.85;
    }

    table {
      margin: 25px auto;
      border-collapse: collapse;
      font-size: 1.2rem;
    }

    td, th {
      padding: 10px 18px;
    }

    /* ORIGINAL TABLE STYLE */
    thead {
      background: rgba(255,255,255,0.1);
      border-bottom: 2px solid var(--primary);
    }

    tbody tr {
      border-top: 1px solid rgba(255,255,255,0.1);
    }

    #remaining {
      font-size: 2rem;
      font-family: 'Source Code Pro', monospace;
    }

    .brand {
      position: fixed;
      bottom: 10px;
      width: 100%;
      text-align: center;
      font-size: 0.8rem;
      opacity: 0.6;
      color: var(--primary);
    }

    /* DROPDOWN */
    .video-picker {
      position: fixed;
      top: 10px;
      right: 10px;
      z-index: 10;
    }

    select {
      padding: 8px 10px;
      border-radius: 8px;
      border: none;
      background: rgba(0,0,0,0.6);
      color: white;
      cursor: pointer;
    }

    /* =========================
       THEMES
       ========================= */

    body.theme-default {
      --primary: white;
    }

    body.theme-geast {
      --primary: rgb(235,0,41);
    }

    body.theme-gnorth {
      --primary: rgb(205,151,0);
    }

    body.theme-gsouth {
      --primary: rgb(235,0,41);
      --secondary: rgb(46,85,151);
      --accent: rgb(160,160,160);
    }

    body.theme-gwest {
      --primary: rgb(0,88,60);
    }

    h1, h2 {
      color: var(--primary);
    }

    /* SOUTH 3-COLOR STRIPE */
    body.theme-gsouth .container::after {
      content: "";
      display: block;
      height: 6px;
      margin-top: 15px;
      border-radius: 4px;
      background: linear-gradient(
        to right,
        var(--primary) 0%,
        var(--primary) 33%,
        var(--secondary) 33%,
        var(--secondary) 66%,
        var(--accent) 66%,
        var(--accent) 100%
      );
    }

    /* POSITIONING */
    body.pos-center .container {
      margin: 8vh auto;
    }

    body.pos-left .container {
      margin: 8vh 0 0 5vw;
    }

    body.pos-right .container {
      margin: 8vh 5vw 0 auto;
    }

  </style>
</head>

<body class="theme-default pos-center">

  <!-- DROPDOWN -->
  <div class="video-picker">
    <select onchange="setMode(this.value)">
      <optgroup label="Schools">
        <option value="geast">Glenbard East</option>
        <option value="gnorth">Glenbard North</option>
        <option value="gsouth">Glenbard South</option>
        <option value="gwest">Glenbard West</option>
      </optgroup>

      <optgroup label="Animals">
        <option value="otter">Otters</option>
        <option value="jellyfish">Jellyfish</option>
        <option value="baldeagle">Bald Eagle</option>
      </optgroup>

      <optgroup label="Clock Position">
        <option value="pos-left">Left</option>
        <option value="pos-center">Center</option>
        <option value="pos-right">Right</option>
      </optgroup>
    </select>
  </div>

  <!-- VIDEO -->
  <div class="video-bg">
    <iframe
      id="bgVideo"
      src="https://www.youtube.com/embed/9mg9PoFEX2U?autoplay=1&mute=1&controls=0"
      frameborder="0"
      allow="autoplay; fullscreen">
    </iframe>
  </div>

  <div class="overlay"></div>

  <!-- CLOCK -->
  <div class="container">
    <h2 id="day"></h2>
    <h2 id="date"></h2>
    <h1 id="time"></h1>

    <table>
      <thead>
        <tr><td>CURRENT CLASS</td><th>ENDS AT</th></tr>
      </thead>
      <tbody>
        <tr><td id="current"></td><td id="end"></td></tr>
      </tbody>

      <thead>
        <tr><td>NEXT CLASS</td><th>STARTS AT</th></tr>
      </thead>
      <tbody>
        <tr><td id="next"></td><td id="start"></td></tr>
      </tbody>

      <thead>
        <tr><td colspan="2">TIME REMAINING</td></tr>
      </thead>
      <tbody>
        <tr><td colspan="2" id="remaining"></td></tr>
      </tbody>
    </table>

    <h2 id="lunch"></h2>
  </div>

  <div class="brand">Glenbard Clock</div>

  <script>
    const config = {
      geast:  { theme: "geast" },
      gnorth: { theme: "gnorth" },
      gsouth: { theme: "gsouth" },
      gwest:  { theme: "gwest" },

      otter: {
        theme: "default",
        video: "https://www.youtube.com/embed/9mg9PoFEX2U?autoplay=1&mute=1&controls=0"
      },
      jellyfish: {
        theme: "default",
        video: "https://www.youtube.com/embed/m1XcdxjVGos?autoplay=1&mute=1&controls=0"
      },
      baldeagle: {
        theme: "default",
        video: "https://www.youtube.com/embed/B4-L2nfGcuE?autoplay=1&mute=1&controls=0"
      },

      "pos-left":   { position: "left" },
      "pos-center": { position: "center" },
      "pos-right":  { position: "right" }
    };

    function setMode(mode) {
      const video = document.getElementById("bgVideo");
      const selected = config[mode];

      if (selected.theme) {
        document.body.classList.remove(
          ...Array.from(document.body.classList).filter(c => c.startsWith("theme-"))
        );
        document.body.classList.add("theme-" + selected.theme);
        localStorage.setItem("theme", selected.theme);
      }

      if (selected.video) {
        video.src = selected.video;
        localStorage.setItem("video", selected.video);
      }

      if (selected.position) {
        document.body.classList.remove("pos-left", "pos-center", "pos-right");
        document.body.classList.add("pos-" + selected.position);
        localStorage.setItem("position", selected.position);
      }
    }

    window.onload = () => {
      const savedTheme = localStorage.getItem("theme") || "default";
      const savedVideo = localStorage.getItem("video");
      const savedPosition = localStorage.getItem("position") || "center";

      document.body.classList.add("theme-" + savedTheme);
      document.body.classList.add("pos-" + savedPosition);

      if (savedVideo) {
        document.getElementById("bgVideo").src = savedVideo;
      }
    };
  </script>

</body>
</html>
