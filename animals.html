<!DOCTYPE html>
<html>
  <head>
    <title>Glenbard Clock</title>
    <base target="_top">

    <!-- Fonts -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Roboto:300,400,600">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Source+Code+Pro">

    <style>
      html, body {
        margin: 0;
        padding: 0;
        height: 100%;
        font-family: 'Roboto', sans-serif;
        color: white;
        overflow: hidden;
        background: black;
      }

      /* Background video */
      .video-bg iframe {
        position: absolute;
        top: 50%;
        left: 50%;
        width: 100vw;
        height: 100vh;
        transform: translate(-50%, -50%);
        pointer-events: none;
      }

      .video-bg iframe {
        position: absolute;
        top: 50%;
        left: 50%;
        width: 177.78vh; /* 16:9 ratio */
        height: 100vh;
        transform: translate(-50%, -50%);
      }

      /* Overlay */
      .overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0,0,0,0.3);
        z-index: -1;
      }

      /* Clock panel */
      .container {
        text-align: center;
        margin: 8vh auto;
        padding: 25px 40px;
        width: fit-content;

        background: rgba(0,0,0,0.35);
        backdrop-filter: blur(10px);
        border-radius: 16px;
        box-shadow: 0 8px 30px rgba(0,0,0,0.5);
      }

      h1 {
        font-size: 4rem;
        font-weight: 300;
        margin: 0;
      }

      h2 {
        font-weight: 300;
        margin: 5px;
        opacity: 0.85;
      }

      table {
        margin: 25px auto;
        border-collapse: collapse;
        font-size: 1.2rem;
      }

      td, th {
        padding: 10px 18px;
      }

      thead {
        background: rgba(255,255,255,0.1);
        font-weight: 500;
      }

      tbody tr {
        border-top: 1px solid rgba(255,255,255,0.1);
      }

      #remaining {
        font-size: 2rem;
        font-family: 'Source Code Pro', monospace;
      }

      .brand {
        position: fixed;
        bottom: 10px;
        width: 100%;
        text-align: center;
        font-size: 0.8rem;
        opacity: 0.5;
      }

      /* DROPDOWN SELECTOR */
      .video-picker {
        position: fixed;
        top: 10px;
        right: 10px;
        z-index: 10;
      }

      .video-picker select {
        padding: 8px 10px;
        border-radius: 8px;
        border: none;
        background: rgba(0,0,0,0.6);
        color: white;
        font-size: 0.9rem;
        outline: none;
        cursor: pointer;
      }
    </style>

    <script defer src="script.js"></script>
  </head>

  <body>

    <!-- VIDEO SELECTOR DROPDOWN -->
    <div class="video-picker">
      <select id="videoSelect" onchange="setVideo(this.value)">
        <option value="otter">Otters</option>
        <option value="jellyfish">Jellyfish</option>
        <option value="moonjelly">Moon Jelly</option>
        <option value="wildlife">Wildlife</option>
        <option value="penguin">Penguin</option>
        <option value="baldeagle">Bald Eagle</option>
      </select>
    </div>

    <!-- BACKGROUND VIDEO -->
    <div class="video-bg">
      <iframe
        id="bgVideo"
        src="https://www.youtube.com/embed/9mg9PoFEX2U?autoplay=1&mute=1&controls=0"
        frameborder="0"
        allow="autoplay; fullscreen">
      </iframe>
    </div>

    <!-- OVERLAY -->
    <div class="overlay"></div>

    <!-- CLOCK CONTENT -->
    <div class="container">
      <h2 id="day"></h2>
      <h2 id="date"></h2>
      <h1 id="time"></h1>

      <table>
        <thead>
          <tr>
            <td>CURRENT CLASS</td>
            <th>ENDS AT</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td id="current"></td>
            <td id="end"></td>
          </tr>
        </tbody>

        <thead>
          <tr>
            <td>NEXT CLASS</td>
            <th>STARTS AT</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td id="next"></td>
            <td id="start"></td>
          </tr>
        </tbody>

        <thead>
          <tr>
            <td colspan="2">TIME REMAINING</td>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td colspan="2" id="remaining"></td>
          </tr>
        </tbody>
      </table>

      <h2 id="lunch" onclick="updateLunch()"></h2>
    </div>

    <div class="brand">Glenbard Clock Provided By Paul Gajewski</div>

    <!-- VIDEO SWITCH SCRIPT -->
    <script>
      function setVideo(type) {
        const video = document.getElementById("bgVideo");

        const videos = {
          otter: "https://www.youtube.com/embed/9mg9PoFEX2U?autoplay=1&mute=1&controls=0",
          jellyfish: "https://www.youtube.com/embed/m1XcdxjVGos?autoplay=1&mute=1&controls=0",
          moonjelly: "https://www.youtube.com/embed/7N9-FODmuBA?autoplay=1&mute=1&controls=0",
          wildlife: "https://www.youtube.com/embed/F0GOOP82094?autoplay=1&mute=1&controls=0",
          penguin: "https://www.youtube.com/embed/HHp4rjhJsWI?autoplay=1&mute=1&controls=0",
          baldeagle: "https://www.youtube.com/embed/B4-L2nfGcuE?autoplay=1&mute=1&controls=0"
        };

        video.src = videos[type];
      }
    </script>

  </body>
</html>
